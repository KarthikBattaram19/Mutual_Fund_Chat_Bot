[build]
builder = "RAILPACK"
# Build the vector index from committed sample chunks (no live Groww fetch at deploy time).
buildCommand = "python scripts/index_from_samples.py"

[deploy]
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
